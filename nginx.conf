# Statische site. Compressie en TLS doet Caddy ervoor; hier alleen bestanden en cache-headers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Lettertypen en afbeeldingen veranderen vrijwel nooit; de html wel, dus die altijd opnieuw vragen.
    location ~* \.(woff2|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
