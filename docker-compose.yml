# 4nine64.nl op de Hetzner: één nginx die de statische site uit ./site serveert. Geen build, geen
# database. Caddy (deploy-caddy-1, van de voorzieningencatalogus) bereikt hem als 4nine64-web:80
# over het netwerk deploy_vzc — dezelfde opzet als matchxl-app en hrxl-app. Uitrollen doet
# scripts/deploy.sh vanaf de werkplek.
services:
  web:
    image: nginx:1.27-alpine
    container_name: 4nine64-web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [proxy]

networks:
  proxy:
    external: true
    name: deploy_vzc
